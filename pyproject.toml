[project]
name = "argo"
version = "1.0.0"
description = "Argo: violenza, violenza con arma e scippi dalle telecamere CCTV (scheletri + tracking + ST-GCN + rete video), con WARNING ARMA"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "ultralytics>=8.4",
    "torch",
    "torchvision",
    "lap",  # richiesto dal tracker di Ultralytics
]

[project.scripts]
argo = "sicurezza.demo:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sicurezza"]

# In locale torch CPU (il portatile non ha CUDA); su Kaggle torch è già installato e il pacchetto si installa con --no-deps.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["lento: test lunghi su CPU (addestramento vero); si lanciano con: uv run pytest -m lento"]
addopts = "-m 'not lento'"
