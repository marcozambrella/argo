<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ARGO · control room</title>
  <link rel="icon" href="/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Megrim&family=Alegreya+Sans+SC:wght@500;800&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/pannello.css">
</head>
<body>
  <header class="testata">
    <div class="marchio">
      <img src="/logo.svg" alt="" width="42" height="42">
      <span class="nome">ARGO</span>
      <span class="sotto">control room</span>
    </div>
    <nav class="schede" role="tablist" aria-label="Views">
      <button role="tab" id="scheda-telecamere" aria-selected="true" aria-controls="vista-telecamere">Cameras</button>
      <button role="tab" id="scheda-archivio" aria-selected="false" aria-controls="vista-archivio">Archive</button>
    </nav>
    <div class="stato-generale">
      <span id="modalita" class="etichetta">…</span>
      <time id="orologio">--:--:--</time>
    </div>
  </header>

  <div id="striscia-allarme" class="striscia-allarme" role="alert" hidden></div>

  <main>
    <section id="vista-telecamere" class="vista" role="tabpanel" aria-labelledby="scheda-telecamere">
      <div id="griglia" class="griglia"></div>
      <aside class="registro">
        <h2>Event log</h2>
        <ol id="registro" class="voci"></ol>
        <p class="vuoto" id="registro-vuoto">No events yet: the log shows alarms, weapons and class changes.</p>
      </aside>
    </section>

    <section id="vista-archivio" class="vista vista-archivio" role="tabpanel" aria-labelledby="scheda-archivio" hidden>
      <aside class="sessioni">
        <h2>Sessions</h2>
        <ul id="sessioni"></ul>
      </aside>
      <div class="lettore">
        <video id="video-archivio" controls muted playsinline></video>
        <div class="striscia-classi" id="striscia-classi" title="Decided class over time">
          <div class="testina" id="testina"></div>
        </div>
        <ul class="legenda">
          <li><i class="c-normale"></i>Normal</li>
          <li><i class="c-violenza"></i>Violence</li>
          <li><i class="c-violenza_con_arma"></i>Armed violence</li>
          <li><i class="c-scippo"></i>Snatching</li>
          <li><i class="c-allarme"></i>Alarm</li>
          <li><i class="c-warning"></i>Weapon warning</li>
        </ul>
        <p class="vuoto" id="archivio-vuoto">Pick a session.</p>
      </div>
      <aside class="registro">
        <h2>Session events</h2>
        <ol id="registro-archivio" class="voci"></ol>
      </aside>
    </section>
  </main>

  <template id="modello-riquadro">
    <article class="riquadro">
      <header>
        <span class="nome-cam"></span>
        <span class="badge"></span>
      </header>
      <div class="immagine"><img alt=""></div>
      <footer>
        <div class="riga-classe"><span class="classe">—</span><span class="misure"></span></div>
        <div class="barre"></div>
        <div class="spie"><span class="spia spia-warning">WEAPON WARNING</span><span class="spia spia-allarme">VIOLENCE ALARM</span></div>
        <p class="errore" hidden></p>
      </footer>
    </article>
  </template>

  <script src="/pannello.js"></script>
</body>
</html>
